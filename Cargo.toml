[workspace]
resolver = "3"
members = ["logics/models", "logics/core", "logics/tests", "tools/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
axvern-models = { path = "logics/models" }
axvern-core = { path = "logics/core" }
clap = { version = "=4.6.7", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
directories = "=6.0.0"
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode"] }
ignore = "=0.4.33"
globset = { version = "=0.4.20", default-features = false }
tempfile = "=3.27.0"
libc = "=0.2.190"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
dbg_macro = "warn"
todo = "warn"
