[workspace]
resolver = "3"
members = ["logics/models", "logics/core", "logics/tests", "tools/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
axvern-models = { path = "logics/models" }
axvern-core = { path = "logics/core" }
clap = { version = "=4.6.7", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
directories = "=6.0.0"
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode"] }
globset = { version = "=0.4.20", default-features = false }
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
