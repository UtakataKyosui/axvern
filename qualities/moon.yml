toolchains:
  default: system
taskOptions:
  cache: false
  runFromWorkspaceRoot: true
tasks:
  harness-test:
    command: python3 qualities/scripts/test_project_gate.py
    deps: [qualities:agent-hook-test]
  agent-hook-test:
    command: python3 qualities/scripts/test_agent_hook.py
  project-check:
    command: python3 qualities/scripts/project_gate.py check
  project-hooks:
    command: python3 qualities/scripts/project_gate.py install-hooks
  fmt:
    command: cargo fmt --all --check
  check:
    command: cargo check --workspace --all-targets --locked
  clippy:
    command: cargo clippy --workspace --all-targets --locked -- -D warnings
  test:
    command: python3 qualities/scripts/test.py
    deps: [qualities:build]
  build:
    command: cargo build --workspace --locked
  discovery-tools:
    command: python3 qualities/scripts/discovery_tools.py
  pueue-spike:
    command: python3 qualities/scripts/pueue_spike.py --record target/pueue-spike.json
  links:
    command: python3 qualities/scripts/check_links.py
  release-smoke:
    command: python3 qualities/scripts/release_smoke.py
  verify:
    command: noop
    deps: [qualities:harness-test, qualities:fmt, qualities:check, qualities:clippy, qualities:test, qualities:build, qualities:links, qualities:release-smoke, site:check, site:build]
