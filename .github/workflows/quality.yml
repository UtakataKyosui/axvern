name: Quality
on:
  push:
    branches: [main]
  pull_request:
  # Cache entries expire after 7 days without access; keep main's warm.
  schedule:
    - cron: '0 18 * * 0,3'
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  # main runs warm the shared caches; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      site: ${{ steps.plan.outputs.site }}
      links: ${{ steps.plan.outputs.links }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: |
          python3 qualities/scripts/test_ci_plan.py
          python3 qualities/scripts/test_discovery_tools.py
          python3 qualities/scripts/ci_plan.py

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - run: moon run qualities:fmt

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      # Runner image variables are not in the env expression context.
      - run: echo "IMAGE_OS=$ImageOS" >> "$GITHUB_ENV"
      # Caches registry/git and dependency artifacts keyed by toolchain and lockfile;
      # workspace crates are pruned, so entries do not grow per commit.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.IMAGE_OS }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: qualities/mojo-requirements.txt
      - name: Install pinned Mojo compiler for CLI contract tests
        run: |
          python -m venv target/mojo-env
          target/mojo-env/bin/python -m pip install --require-hashes -r qualities/mojo-requirements.txt
      # Tool caches are saved right after install, so a failing gate later in
      # the job does not discard a cold build. eza stays off PATH until its spike.
      - uses: actions/cache/restore@v4
        id: pueue
        with:
          path: ${{ runner.temp }}/pueue
          key: pueue-v2-${{ env.IMAGE_OS }}-${{ runner.arch }}-4.0.4-rust-1.98.0
      - uses: actions/cache/restore@v4
        id: discovery
        with:
          path: ${{ runner.temp }}/discovery
          key: discovery-v2-${{ env.IMAGE_OS }}-${{ runner.arch }}-fd10.5.0-rg15.2.0-bat0.26.1-tokei15.0.0-rust1.98.0
      - uses: actions/cache/restore@v4
        id: eza
        with:
          path: ${{ runner.temp }}/eza
          key: eza-v2-${{ env.IMAGE_OS }}-${{ runner.arch }}-0.23.5-rust1.98.0
      - name: Install missing pinned CLIs in parallel
        if: steps.pueue.outputs.cache-hit != 'true' || steps.discovery.outputs.cache-hit != 'true' || steps.eza.outputs.cache-hit != 'true'
        env:
          PUEUE_HIT: ${{ steps.pueue.outputs.cache-hit }}
          DISCOVERY_HIT: ${{ steps.discovery.outputs.cache-hit }}
          EZA_HIT: ${{ steps.eza.outputs.cache-hit }}
        run: |
          pids=()
          install() {  # root crate version
            CARGO_TARGET_DIR="$RUNNER_TEMP/build-$2" \
              cargo install "$2" --version "$3" --locked --root "$RUNNER_TEMP/$1" >"$RUNNER_TEMP/install-$2.log" 2>&1 &
            pids+=("$!:$2")
          }
          [[ "$PUEUE_HIT" == true ]] || install pueue pueue 4.0.4
          if [[ "$DISCOVERY_HIT" != true ]]; then
            install discovery fd-find 10.5.0
            install discovery ripgrep 15.2.0
            install discovery bat 0.26.1
            install discovery tokei 15.0.0
          fi
          [[ "$EZA_HIT" == true ]] || install eza eza 0.23.5
          failed=0
          for entry in "${pids[@]}"; do
            if ! wait "${entry%%:*}"; then failed=1; cat "$RUNNER_TEMP/install-${entry#*:}.log"; fi
            echo "cargo install ${entry#*:}: $(tail -n 1 "$RUNNER_TEMP/install-${entry#*:}.log")"
          done
          exit "$failed"
      - if: steps.pueue.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pueue
          key: ${{ steps.pueue.outputs.cache-primary-key }}
      - if: steps.discovery.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/discovery
          key: ${{ steps.discovery.outputs.cache-primary-key }}
      - if: steps.eza.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/eza
          key: ${{ steps.eza.outputs.cache-primary-key }}
      - name: Install pinned ast-grep CLI
        run: npm install --prefix "$RUNNER_TEMP/ast-grep" @ast-grep/cli@0.51.0
      - id: ready
        run: |
          mkdir -p target
          {
            echo "$RUNNER_TEMP/pueue/bin"
            echo "$RUNNER_TEMP/discovery/bin"
            echo "$RUNNER_TEMP/ast-grep/node_modules/.bin"
          } >> "$GITHUB_PATH"

      # Gate steps run independently once setup succeeds, so one failure does not
      # hide the evidence of the others. Tests are always executed, never cached.
      - name: Clippy
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: moon run qualities:clippy 2>&1 | tee -a target/quality.log
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: moon run qualities:build 2>&1 | tee -a target/quality.log
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          AXVERN_REQUIRE_DISCOVERY_TOOLS: '1'
        run: moon run qualities:test 2>&1 | tee -a target/quality.log
      - name: Pueue spike
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: moon run qualities:pueue-spike 2>&1 | tee -a target/quality.log
      - name: Release smoke
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          if [[ -f qualities/scripts/release_smoke.py ]]; then
            moon run qualities:release-smoke 2>&1 | tee -a target/quality.log
          fi
      # The required gate above runs without optional eza. Measure its
      # display-only replacement separately; no structured discovery uses it.
      - name: Measure optional eza display through Policy and Pueue
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          AXVERN_REQUIRE_EZA_SPIKE: '1'
          AXVERN_TEST_BIN: ${{ github.workspace }}/target/debug/axvern
        run: |
          export PATH="$RUNNER_TEMP/eza/bin:$PATH"
          cargo test -p axvern-tests --locked --test tools_live -- --nocapture 2>&1 | tee -a target/quality.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.os }}
          path: |
            target/pueue-spike.json
            target/release-evidence.json
            target/quality.log
            target/cli-contract-evidence.json
            target/discovery-tools.json
          if-no-files-found: ignore

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
      - id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sites/axvern-document-site/pnpm-lock.yaml') }}
          restore-keys: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
        working-directory: sites/axvern-document-site
      - run: moon run site:check
      - run: moon run site:build

  links:
    needs: changes
    if: needs.changes.outputs.links == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [[ -f qualities/scripts/check_links.py ]]; then
            python3 qualities/scripts/check_links.py
          fi

  # Single stable check for branch protection; skipped groups count as passing.
  quality:
    needs: [changes, fmt, rust, site, links]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != success && "$result" != skipped ]]; then exit 1; fi
          done
