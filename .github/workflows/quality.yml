name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - run: npm install --global @moonrepo/cli@2.5.6 pnpm@12.11.2
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: cargo install pueue --version 4.0.4 --locked
      - run: pnpm install --frozen-lockfile
        working-directory: sites/axvern-document-site
      - run: moon run qualities:verify qualities:pueue-spike
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pueue-spike-${{ matrix.os }}
          path: target/pueue-spike.json
          if-no-files-found: ignore
